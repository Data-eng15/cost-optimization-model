// ─── Icon (Lucide UMD wrapper) ────────────────────────────────────────────────
const LUCIDE = window.lucide || {};
const ICONS  = (LUCIDE && LUCIDE.icons) || {};

function toAttrs(o, extra={}) {
  const out={};
  for(const k in o){ if(k==='stroke-width') out.strokeWidth=o[k]; else if(k==='stroke-linecap') out.strokeLinecap=o[k]; else if(k==='stroke-linejoin') out.strokeLinejoin=o[k]; else if(k==='class') out.className=o[k]; else out[k]=o[k]; }
  Object.assign(out,extra); return out;
}
function renderNode([tag,attrs,kids],key){ const ch=Array.isArray(kids)?kids.map((c,i)=>renderNode(c,i)):null; return React.createElement(tag,{...toAttrs(attrs),key},ch); }
function Icon({name,className='w-4 h-4',strokeWidth=1.75,color,...rest}){
  const data=ICONS[name]||LUCIDE[name];
  if(!data) return <span className={className} style={{display:'inline-block',background:'currentColor',opacity:.35,borderRadius:2}}/>;
  const[,rootAttrs,kids]=data;
  const attrs=toAttrs(rootAttrs,{className,strokeWidth,...(color?{stroke:color}:{}),'aria-hidden':true,...rest});
  delete attrs.width; delete attrs.height;
  return React.createElement('svg',attrs,kids.map((c,i)=>renderNode(c,i)));
}

// ─── Primitives ───────────────────────────────────────────────────────────────
function Panel({title,eyebrow,children,className='',actions=null}){
  return(
    <section className={`relative rounded-md border border-ink-700/80 bg-ink-850/60 ${className}`}>
      {(title||eyebrow||actions)&&(
        <header className="flex items-center justify-between px-4 py-2.5 border-b border-ink-700/60">
          <div className="flex items-baseline gap-3 min-w-0">
            {eyebrow&&<span className="font-mono text-[10px] uppercase tracking-[.18em] text-slate2-500">{eyebrow}</span>}
            {title&&<h3 className="text-[13px] font-semibold tracking-tight text-slate-100 truncate">{title}</h3>}
          </div>
          {actions&&<div className="flex items-center gap-1.5 shrink-0">{actions}</div>}
        </header>
      )}
      <div className="p-4">{children}</div>
    </section>
  );
}
function Pill({tone='slate',children,dot=false,className=''}){
  const t={slate:'bg-ink-800 text-slate2-300 border-ink-700',emerald:'bg-emerald2-600/15 text-emerald2-400 border-emerald2-600/40',amber:'bg-amber2-500/15 text-amber2-400 border-amber2-500/45',crimson:'bg-crimson2-500/15 text-crimson2-400 border-crimson2-500/45',azure:'bg-azure2-500/15 text-azure2-400 border-azure2-500/40'}[tone];
  const d={slate:'bg-slate2-400',emerald:'bg-emerald2-400',amber:'bg-amber2-400',crimson:'bg-crimson2-400',azure:'bg-azure2-400'}[tone];
  return <span className={`inline-flex items-center gap-1.5 rounded-sm border px-1.5 py-0.5 font-mono text-[10px] uppercase tracking-wider ${t} ${className}`}>{dot&&<span className={`w-1.5 h-1.5 rounded-full pulse-dot ${d}`}/>}{children}</span>;
}
function Btn({children,variant='ghost',size='sm',className='',icon,iconRight,...rest}){
  const v={ghost:'border border-ink-700 hover:bg-ink-800 text-slate-200',emerald:'bg-emerald2-600 hover:bg-emerald2-500 text-ink-950 border border-emerald2-500 shadow-glow-emerald',crimson:'bg-crimson2-600 hover:bg-crimson2-500 text-white border border-crimson2-500',amber:'bg-amber2-500 hover:bg-amber2-400 text-ink-950 border border-amber2-400',azure:'bg-azure2-600 hover:bg-azure2-500 text-white border border-azure2-500'}[variant];
  const s={xs:'h-6 px-2 text-[11px] gap-1',sm:'h-7 px-2.5 text-[11.5px] gap-1.5',md:'h-8 px-3 text-xs gap-1.5',lg:'h-10 px-4 text-sm gap-2'}[size];
  return <button className={`inline-flex items-center justify-center rounded-sm font-medium tracking-tight transition-colors ${v} ${s} ${className}`} {...rest}>{icon&&<Icon name={icon} className="w-3.5 h-3.5"/>}{children}{iconRight&&<Icon name={iconRight} className="w-3.5 h-3.5"/>}</button>;
}
function Kbd({children}){ return <kbd className="inline-flex items-center justify-center min-w-[1.4em] px-1.5 h-5 rounded-[3px] border border-ink-700 bg-ink-800 font-mono text-[10px] text-slate2-300">{children}</kbd>; }
function Toggle({on,onChange,disabled=false,label}){
  return <button type="button" onClick={()=>!disabled&&onChange(!on)} className={`switch-track relative inline-flex items-center h-5 w-9 rounded-full border ${on?'bg-emerald2-600/80 border-emerald2-500':'bg-ink-800 border-ink-600'} ${disabled?'opacity-50 cursor-not-allowed':'cursor-pointer'}`} aria-label={label} aria-pressed={on}><span className={`switch-thumb absolute top-0.5 left-0.5 w-3.5 h-3.5 rounded-full bg-slate-100 shadow-md ${on?'translate-x-4':''}`}/></button>;
}
function Sparkline({data,color='#5EA8FF',width=120,height=32,fill=true}){
  const min=Math.min(...data),max=Math.max(...data),range=(max-min)||1,stepX=width/(data.length-1);
  const pts=data.map((v,i)=>[i*stepX,height-((v-min)/range)*(height-4)-2]);
  const d=pts.map(([x,y],i)=>(i===0?`M${x},${y}`:`L${x},${y}`)).join(' ');
  const area=`${d} L${width},${height} L0,${height} Z`;
  const id='sg'+color.replace('#','');
  return <svg width={width} height={height} viewBox={`0 0 ${width} ${height}`} className="overflow-visible"><defs><linearGradient id={id} x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={color} stopOpacity=".35"/><stop offset="100%" stopColor={color} stopOpacity="0"/></linearGradient></defs>{fill&&<path d={area} fill={`url(#${id})`}/>}<path d={d} fill="none" stroke={color} strokeWidth="1.5" strokeLinejoin="round" strokeLinecap="round"/></svg>;
}

    {eyebrow:'REGRESSOR · QUALITY',label:'R² Score',value:'0.986',delta:'98.6% variance explained',sub:'margin prediction · test set',tone:'azure',icon:'Activity',trail:'Feature-driven margin formula yields near-perfect R². No label-leakage — margin derived from features only.',data:KPI_SPARKLINES.r2,color:'#5EA8FF'},

      ))}
    </div>
  );
}

// ─── Section 2: Prediction Engine ─────────────────────────────────────────────
const DEFAULTS = {
  project_type:0, estimated_loc:5000, complexity_score:'Medium',
  timeline_days:45, team_size_required:3, domain_category:'Web',
  technical_risk_level:'Low', integration_count:2, seniority_required:'Mid',
  regulatory_compliance:0, testing_coverage_pct:70, documentation_level:'Standard',
  performance_tier:'Standard', security_criticality:'Low',
  budget_pressure:'Moderate', maintainability_req:'Medium',
  technical_debt_score:'Low', documentation_quality:'Standard',
  language_modernity:'Current', team_familiarity:'High',
  codebase_age_years:3, existing_test_coverage_pct:50,
  dependency_count:40, last_refactor_years:2,
  incident_rate_monthly:1.0, code_duplication_pct:10,
};

const riskMap  = {Low:0,Medium:1,High:2,Critical:3};
const debtMap  = {Low:0,Medium:1,High:2,Critical:3};
const famMap   = {Unfamiliar:0,Low:1,Medium:2,High:3};
const langMap  = {Legacy:0,Dated:1,Modern:2,Current:3};
const cplxMap  = {Low:0,Medium:1,High:2};

function simulatePredict(f){
  const risk=riskMap[f.technical_risk_level]||0;
  const sec=riskMap[f.security_criticality]||0;
  const cplx=cplxMap[f.complexity_score]||0;
  const isL=f.project_type===1;

  if(risk>=3||sec>=3)
    return{team:'Human',probs:{Human:0.94,Hybrid:0.05,AI:0.01},reason:'Critical risk/security — NFR-06 safety gate prevents AI routing',gate:'NFR-06'};

  if(isL){
    const debt=debtMap[f.technical_debt_score]||0;
    const fam=famMap[f.team_familiarity]||3;
    const lang=langMap[f.language_modernity]||2;
    if(debt>=3||fam<=1)
      return{team:'Human',probs:{Human:0.91,Hybrid:0.08,AI:0.01},reason:'Critical legacy debt or unfamiliar team — human oversight mandatory',gate:null};
    if(debt===0&&fam>=3&&lang>=2&&risk===0&&sec===0)
      return{team:'AI',probs:{Human:0.07,Hybrid:0.20,AI:0.73},reason:'Modern-stack, low-debt legacy with expert familiarity — strong AI candidate',gate:null};
    if(debt>=2||risk>=2)
      return{team:'Human',probs:{Human:0.77,Hybrid:0.21,AI:0.02},reason:'High legacy debt or elevated risk — human-led remediation recommended',gate:null};
    if(risk<=1&&cplx<=1)
      return{team:'Hybrid',probs:{Human:0.22,Hybrid:0.71,AI:0.07},reason:'Moderate legacy complexity — hybrid human+AI oversight balances risk',gate:null};
    return{team:'Human',probs:{Human:0.61,Hybrid:0.35,AI:0.04},reason:'Legacy project with multiple risk factors — human leadership preferred',gate:null};
  }

  // Greenfield
  if(cplx>=2&&risk>=2)
    return{team:'Human',probs:{Human:0.82,Hybrid:0.16,AI:0.02},reason:'High complexity + high risk combination signals human leadership',gate:null};
  if(f.regulatory_compliance===1&&(risk>=1||sec>=1))
    return{team:'Hybrid',probs:{Human:0.30,Hybrid:0.64,AI:0.06},reason:'Regulatory compliance with risk factors — hybrid ensures auditability',gate:null};
  const loc=f.estimated_loc||5000;
  if(loc<4000&&risk===0&&cplx===0&&sec===0)
    return{team:'AI',probs:{Human:0.05,Hybrid:0.18,AI:0.77},reason:'Small low-risk greenfield — optimal AI candidate per TCO research',gate:null};
  if(loc<10000&&risk<=1&&cplx<=1&&sec<=1)
    return{team:'AI',probs:{Human:0.09,Hybrid:0.29,AI:0.62},reason:'Small-medium greenfield with manageable complexity — AI cost-effective',gate:null};
  if(risk>=2||cplx>=2)
    return{team:'Human',probs:{Human:0.74,Hybrid:0.23,AI:0.03},reason:'Elevated complexity or risk tilts recommendation toward human oversight',gate:null};
  return{team:'Hybrid',probs:{Human:0.17,Hybrid:0.74,AI:0.09},reason:'Standard greenfield scope — hybrid balances AI speed with human governance',gate:null};
}

function estimateMargin(f,team){
  const risk=riskMap[f.technical_risk_level]||0;
  const cplx=cplxMap[f.complexity_score]||0;
  let base=team==='AI'?38:team==='Hybrid'?24:16;
  base-=risk*4; base-=cplx*3;
  if(f.regulatory_compliance===1) base-=3;
  if(f.project_type===1){
    base-=(debtMap[f.technical_debt_score]||0)*4+3;
    if(f.codebase_age_years>10) base-=3;
  }
  const loc=f.estimated_loc||5000;
  if(loc>20000) base-=4;
  if(loc>60000) base-=5;
  return Math.max(2,Math.min(58,Math.round(base)));
}

function PredictionEngine(){

        if(resp.ok){

            team:   data.recommended_team,

    if(!r){
      r = simulatePredict(f);
      r.margin  = estimateMargin(f, r.team);
      r.source  = 'simulator';

            <div className="p-3 space-y-2 max-h-[420px] overflow-y-auto">
              <FieldGrp label="Est. LOC">

                </select>

              <FieldGrp label="Domain">
                <select value={f.domain_category} onChange={e=>upd('domain_category',e.target.value)}>

function PipeStep({idx,label,sub,tone,active,children}){
  const tc={slate:'text-slate2-400 border-slate2-600/30',azure:'text-azure2-400 border-azure2-500/40',emerald:'text-emerald2-400 border-emerald2-500/40',amber:'text-amber2-400 border-amber2-500/40'}[tone];
  return(
    <div className={`rounded-sm border p-2.5 transition-all ${active?'border-ink-600 bg-ink-800/60':'border-ink-700/50 bg-ink-900/30 opacity-50'}`}>
      <div className="flex items-center gap-2">
        <span className={`font-mono text-[10px] inline-flex items-center justify-center w-6 h-5 rounded-sm border bg-ink-950 ${tc}`}>{idx}</span>
        <div className="leading-tight">
          <div className="text-[12px] font-semibold text-slate-100">{label}</div>
          <div className="font-mono text-[10px] text-slate2-500">{sub}</div>
        </div>
        {active&&<span className="ml-auto w-1.5 h-1.5 rounded-full bg-emerald2-400 pulse-dot"/>}
      </div>
      {children}
    </div>
  );
}
function FieldGrp({label,children}){
  return <div className="flex items-center justify-between gap-2"><span className="font-mono text-[10.5px] text-slate2-400 shrink-0 w-28">{label}</span><div className="flex-1">{children}</div></div>;
}
function SigRow({label,val,imp,warn}){
  return <div className="flex items-center justify-between"><span className="text-slate2-400 truncate">{label}</span><div className="flex items-center gap-2"><span className={warn?'text-amber2-400':'text-slate-200'}>{val}</span><span className="text-slate2-500 text-[10px]">{imp}%</span></div></div>;
}

function PerClassMetrics(){

    {cls:'Human',  tone:'amber',  ...META.perClass.Human},
    {cls:'Hybrid', tone:'azure',  ...META.perClass.Hybrid},
    {cls:'AI',     tone:'emerald',...META.perClass.AI},
  ];
  const learners=[
    {name:'XGBoost',     acc:META.baseClfAcc.XGBoost,     mape:META.baseRgrMape.XGBoost,   tone:'emerald'},
    {name:'DecisionTree',acc:META.baseClfAcc.DecisionTree, mape:META.baseRgrMape.DecisionTree,tone:'slate'},
    {name:'ANN (MLP)',   acc:META.baseClfAcc.ANN,          mape:META.baseRgrMape.ANN,         tone:'azure'},
    {name:'LR / Ridge',  acc:META.baseClfAcc.LogisticRegr, mape:META.baseRgrMape.LinearRegr,  tone:'amber'},
    {name:'★ Meta stack',acc:META.accuracy,                mape:META.mape,                    tone:'crimson'},
  ];
  return(
    <Panel eyebrow="DIAGNOSTICS" title="Per-class Performance + Base Learners" className="col-span-4"
      actions={<Pill tone="slate">test n=240</Pill>}>
      <div className="space-y-1.5 mb-4">
        <div className="grid grid-cols-[3fr_1fr_1fr_1fr_1fr] gap-2 font-mono text-[10px] text-slate2-500 uppercase tracking-[.14em] pb-1 border-b border-ink-700/60">
          <span>Class</span><span className="text-right">P</span><span className="text-right">R</span><span className="text-right">F1</span><span className="text-right">n</span>
        </div>
        {data.map(d=>{
          const tc={amber:'text-amber2-400',azure:'text-azure2-400',emerald:'text-emerald2-400'}[d.tone];
          return(
            <div key={d.cls} className="grid grid-cols-[3fr_1fr_1fr_1fr_1fr] gap-2 font-mono text-[11px]">
              <span className={tc}>{d.cls}</span>
              <span className="text-right text-slate-200">{(d.precision*100).toFixed(1)}%</span>
              <span className={`text-right ${d.recall<0.7?'text-amber2-400':'text-slate-200'}`}>{(d.recall*100).toFixed(1)}%</span>
              <span className="text-right text-slate-200">{(d.f1*100).toFixed(1)}%</span>
              <span className="text-right text-slate2-400">{d.support}</span>
            </div>
          );
        })}
      </div>

      <div className="font-mono text-[10px] uppercase tracking-[.18em] text-slate2-500 mb-1.5 pt-2 border-t border-ink-700/60">Base learner breakdown</div>
      <div className="space-y-1.5">
        {learners.map(l=>{
          const tc={emerald:'text-emerald2-400',slate:'text-slate2-300',azure:'text-azure2-400',amber:'text-amber2-400',crimson:'text-azure2-400 font-semibold'}[l.tone];
          return(
            <div key={l.name} className={`flex items-center justify-between font-mono text-[11px] ${l.name.startsWith('★')?'border border-azure2-600/30 bg-azure2-500/[.05] rounded-sm px-2 py-1':''}`}>
              <span className={tc}>{l.name}</span>
              <div className="flex gap-4 text-slate2-400">
                <span>{(l.acc*100).toFixed(1)}% acc</span>
                <span className={l.mape>10?'text-amber2-400':''}>{l.mape.toFixed(2)}% MAPE</span>
              </div>
            </div>
          );
        })}
      </div>
    </Panel>
  );
}

function LabelDistribution(){
  const gf=META.labelDist.greenfield;
  const lg=META.labelDist.legacy;
  const gfTotal=gf.Human+gf.Hybrid+gf.AI;
  const lgTotal=lg.Human+lg.Hybrid+lg.AI;
  const combined={Human:gf.Human+lg.Human,Hybrid:gf.Hybrid+lg.Hybrid,AI:gf.AI+lg.AI};
  const total=1600;
  return(
    <Panel eyebrow="DATASET · LABELS" title="Label Distribution" className="col-span-3"
      actions={<Pill tone="slate">1,600 records</Pill>}>
      <div className="space-y-4">
        {[{label:'Greenfield (800)',data:gf,n:gfTotal,color:'azure'},{label:'Legacy (800)',data:lg,n:lgTotal,color:'amber'}].map(({label,data,n,color})=>(
          <div key={label}>
            <div className="font-mono text-[10px] uppercase tracking-[.14em] text-slate2-500 mb-1.5">{label}</div>
            {[{cls:'Human',c:'amber'},{cls:'Hybrid',c:'azure'},{cls:'AI',c:'emerald'}].map(({cls,c})=>{
              const v=data[cls];
              const pct=(v/n*100).toFixed(1);
              const bg={amber:'bg-amber2-400',azure:'bg-azure2-400',emerald:'bg-emerald2-400'}[c];
              const tx={amber:'text-amber2-400',azure:'text-azure2-400',emerald:'text-emerald2-400'}[c];
              return(
                <div key={cls} className="flex items-center gap-2 mb-1">
                  <span className={`font-mono text-[11px] w-12 ${tx}`}>{cls}</span>
                  <div className="flex-1 h-1.5 rounded-full bar-track overflow-hidden">
                    <div className={`h-full rounded-full ${bg}`} style={{width:`${pct}%`}}/>
                  </div>
                  <span className="font-mono text-[10.5px] text-slate2-400 tabular-nums">{v}</span>
                  <span className="font-mono text-[10px] text-slate2-500 tabular-nums w-9 text-right">{pct}%</span>
                </div>
              );
            })}
          </div>
        ))}
        <div className="pt-2 border-t border-ink-700/60">
          <div className="font-mono text-[10px] uppercase tracking-[.14em] text-slate2-500 mb-1.5">Combined (1,600)</div>
          {[{cls:'Human',c:'amber'},{cls:'Hybrid',c:'azure'},{cls:'AI',c:'emerald'}].map(({cls,c})=>{
            const v=combined[cls];
            const pct=(v/total*100).toFixed(1);
            const bg={amber:'bg-amber2-400',azure:'bg-azure2-400',emerald:'bg-emerald2-400'}[c];
            const tx={amber:'text-amber2-400',azure:'text-azure2-400',emerald:'text-emerald2-400'}[c];
            return(
              <div key={cls} className="flex items-center gap-2 mb-1">
                <span className={`font-mono text-[11px] w-12 ${tx}`}>{cls}</span>
                <div className="flex-1 h-1.5 rounded-full bar-track overflow-hidden">
                  <div className={`h-full rounded-full ${bg}`} style={{width:`${pct}%`}}/>
                </div>
                <span className="font-mono text-[10.5px] text-slate2-400 tabular-nums">{v}</span>
                <span className="font-mono text-[10px] text-slate2-500 tabular-nums w-9 text-right">{pct}%</span>
              </div>
            );
          })}
          <div className="mt-2 font-mono text-[10px] text-slate2-500">AI rare in legacy (1.4%) — domain-realistic per TCO research</div>
        </div>
      </div>
    </Panel>
  );
}

// ─── Section 4: Team Economics ────────────────────────────────────────────────
function TeamEconomics({tick}){
  const [salary, setSalary] = React.useState(165000);
  const [loading,setLoading]= React.useState(1.32);
  const [tokPerDay,setTokPerDay]=React.useState(800000);

  const humanLoaded=Math.round(salary*loading);
  const humanTotal =Math.round(humanLoaded+28000+(salary/52)*12*0.5);

  // AI: ~INR 100/1k LOC from research, approx $1.20/1k LOC
  const locPerProject=15000;
  const aiCostPerLoc=1.20; // $/1k LOC
  const aiProject=Math.round(locPerProject/1000*aiCostPerLoc);
  const aiAnnual=Math.round(aiProject*52+4800);

  // Hybrid: 40% AI, 60% human time
  const hybridAnnual=Math.round(humanTotal*0.6+aiAnnual*0.4);

  // Live ticker
  const burnPerMin=(tokPerDay/(24*60)*0.002).toFixed(4);
  const tokPerSec=Math.round(tokPerDay/86400+Math.sin(tick/5)*20);

  const teams=[
    {name:'Human',icon:'Users',color:'amber',cost:humanTotal,costLabel:'$'+humanTotal.toLocaleString()+'/yr',subLabel:'1 FTE loaded + recruit + ramp',desc:'Full comprehension, high governance, slow velocity. Best for Critical risk, regulated domains.',margin:16},
    {name:'Hybrid',icon:'GitMerge',color:'azure',cost:hybridAnnual,costLabel:'$'+hybridAnnual.toLocaleString()+'/yr',subLabel:'60% human + 40% AI compute',desc:'Balanced TCO. Human oversight on architecture/review, AI on implementation. Recommended for most projects.',margin:24},
    {name:'AI',icon:'Bot',color:'emerald',cost:aiAnnual,costLabel:'$'+aiAnnual.toLocaleString()+'/yr',subLabel:'~$1.20/1k LOC + licensing',desc:'Lowest upfront cost. Comprehension debt accumulates — requires 40% sprint audit buffer per NFR policy.',margin:38},
  ];

  return(
    <Panel eyebrow="ECONOMICS · TCO RESEARCH BASIS" title="Team Cost Analysis · per project profile" className="col-span-12"
      actions={<><Pill tone="azure">Dharne 2026 · INR 100/1k LOC</Pill><Btn size="xs" icon="Calculator">Sensitivity</Btn></>}>
      <div className="grid grid-cols-12 gap-4">
        {/* 3 team cost cards */}
        <div className="col-span-8 grid grid-cols-3 gap-3">
          {teams.map(t=>{
            const tc={amber:'text-amber2-400',azure:'text-azure2-400',emerald:'text-emerald2-400'}[t.color];
            const bc={amber:'border-amber2-500/35 bg-amber2-500/[.04]',azure:'border-azure2-500/35 bg-azure2-500/[.04]',emerald:'border-emerald2-500/35 bg-emerald2-500/[.04]'}[t.color];
            const barC={amber:'bg-amber2-400',azure:'bg-azure2-400',emerald:'bg-emerald2-400'}[t.color];
            const maxCost=humanTotal;
            return(
              <div key={t.name} className={`rounded-md border p-3 ${bc}`}>
                <div className="flex items-center gap-2 mb-2">
                  <Icon name={t.icon} className={`w-4 h-4 ${tc}`}/>
                  <span className={`font-semibold text-[13px] ${tc}`}>{t.name}</span>
                </div>
                <div className={`font-mono text-[24px] leading-none font-bold ${tc} tabular-nums`}>{t.costLabel}</div>
                <div className="font-mono text-[10px] text-slate2-500 mt-1">{t.subLabel}</div>
                <div className="mt-3 h-1.5 w-full rounded-full bar-track overflow-hidden">
                  <div className={`h-full rounded-full ${barC}`} style={{width:`${Math.min(100,t.cost/Math.max(...teams.map(x=>x.cost))*100)}%`}}/>
                </div>
                <div className="mt-3 text-[11px] text-slate2-300 leading-snug">{t.desc}</div>
                <div className="mt-2 pt-2 border-t border-ink-700/60 flex items-center justify-between">
                  <span className="font-mono text-[10px] text-slate2-500">Avg margin</span>
                  <span className={`font-mono text-[12px] ${tc}`}>{t.margin}%</span>
                </div>
              </div>
            );
          })}
        </div>

        {/* Right: inputs + live ticker */}
        <div className="col-span-4 flex flex-col gap-3">
          <div className="rounded-md border border-ink-700/70 bg-ink-900/40 p-3">
            <div className="font-mono text-[10px] uppercase tracking-[.18em] text-slate2-500 mb-2">Adjust assumptions</div>
            <EconField label="Engineer salary" value={salary} onChange={setSalary} prefix="$" step={5000} max={400000}/>
            <EconField label="Loading factor" value={loading} onChange={setLoading} suffix="×" step={0.01} min={1} max={2.5} fixed={2}/>
            <EconField label="Tokens / day" value={tokPerDay} onChange={setTokPerDay} step={50000} max={5000000}/>
            <div className="mt-2 pt-2 border-t border-ink-700/60 space-y-1 font-mono text-[10.5px]">
              <div className="flex justify-between"><span className="text-slate2-500">Human loaded</span><span className="text-amber2-400">${humanLoaded.toLocaleString()}/yr</span></div>
              <div className="flex justify-between"><span className="text-slate2-500">AI vs Human Δ</span><span className={aiAnnual>humanTotal?'text-crimson2-400':'text-emerald2-400'}>{aiAnnual>humanTotal?'+':'-'}${Math.abs(aiAnnual-humanTotal).toLocaleString()}/yr</span></div>
            </div>
          </div>

          <div className="rounded-md border border-ink-700/60 bg-ink-950/80 overflow-hidden flex-1 flex flex-col">
            <div className="px-3 py-2 border-b border-ink-700/60 font-mono text-[10px] uppercase tracking-[.18em] text-slate2-500 flex items-center gap-2">
              <span className="w-1.5 h-1.5 rounded-full bg-emerald2-400 pulse-dot"/>
              Live AI compute ticker
            </div>
            <div className="overflow-hidden flex-1 flex items-center">
              <div className="marquee-track whitespace-nowrap font-mono text-[10.5px] text-slate2-400 py-2">
                {[0,1].map(k=><span key={k}>
                  <T label="tok/s"    v={`${tokPerSec.toLocaleString()}`}/>
                  <T label="$/min"    v={`$${burnPerMin}`} tone="amber"/>
                  <T label="$/1k-LOC" v="$1.20" tone="azure"/>
                  <T label="vs-human" v={`${(humanTotal/aiAnnual).toFixed(1)}×`} tone="emerald"/>
                  <T label="ctx-fill" v={`${44+(tick%17)}%`}/>
                  <T label="cache"    v={`${51+(tick%23)}%`}/>
                  <T label="seed"     v="42"/>
                </span>)}
              </div>
            </div>
          </div>
        </div>
      </div>
    </Panel>
  );
}
function EconField({label,value,onChange,prefix,suffix,step=1,min=0,max=1000000,fixed=0}){
  return <label className="flex items-center justify-between gap-2 py-1"><span className="text-[11px] text-slate2-400">{label}</span><div className="inline-flex items-center gap-1 font-mono text-[11px]">{prefix&&<span className="text-slate2-500">{prefix}</span>}<input type="number" value={fixed?(+value).toFixed(fixed):value} min={min} max={max} step={step} onChange={e=>onChange(+e.target.value)} className="w-24 bg-ink-850 border border-ink-700 rounded-sm px-1.5 py-0.5 text-right text-slate-100 focus:outline-none focus:border-azure2-500"/>{suffix&&<span className="text-slate2-500">{suffix}</span>}</div></label>;
}
function T({label,v,tone}){
  return <span className="mx-3 inline-flex items-center gap-1"><span className="text-slate2-500 uppercase tracking-[.12em] text-[9.5px]">{label}</span><span className={tone==='amber'?'text-amber2-400':tone==='azure'?'text-azure2-400':tone==='emerald'?'text-emerald2-400':'text-slate-200'}>{v}</span><span className="text-slate2-700">·</span></span>;
}

// ─── App root ─────────────────────────────────────────────────────────────────
function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v));}

function App(){
  const[active,setActive]=React.useState('predict');
  const[tick,setTick]=React.useState(0);
  React.useEffect(()=>{ const id=setInterval(()=>setTick(t=>t+1),1500); return()=>clearInterval(id); },[]);
  const time=new Date(Date.UTC(2026,4,22,14,32,8)+tick*1500).toISOString().slice(11,19)+' UTC';

  return(
    <div className="h-screen w-screen flex bg-ink-900 bg-grid overflow-auto min-w-[1400px]">
      <Sidebar active={active} onSelect={setActive}/>
      <main className="flex-1 min-w-0 flex flex-col">
        <TopBar time={time} active={active}/>
        <div className="flex-1 overflow-y-auto px-5 py-4">
          {/* Section 1 — Model KPI cards */}
          <ModelKPIs/>
          {/* Section 2 — Prediction engine */}
          <div className="grid grid-cols-12 gap-3 mt-4">
            <PredictionEngine/>
          </div>
          {/* Section 3 — Analytics row */}
          <div className="grid grid-cols-12 gap-3 mt-4">
            <FeatureImportance/>
            <PerClassMetrics/>
            <LabelDistribution/>
          </div>
          {/* Section 4 — Team economics */}
          <div className="grid grid-cols-12 gap-3 mt-4 mb-6">
            <TeamEconomics tick={tick}/>
          </div>
        </div>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
