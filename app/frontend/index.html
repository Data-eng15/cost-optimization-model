// Lucide icon shortcut — reads icon data from the `lucide` global (UMD)
// and renders to a React <svg>. Usage: <Icon name="Activity" className="w-4 h-4" />

const LUCIDE = window.lucide || {};
const ICONS  = (LUCIDE && LUCIDE.icons) || {};

function toAttrs(o, extra = {}) {
  const out = {};
  for (const k in o) {
    if      (k === 'stroke-width')   out.strokeWidth   = o[k];
    else if (k === 'stroke-linecap') out.strokeLinecap  = o[k];
    else if (k === 'stroke-linejoin')out.strokeLinejoin = o[k];
    else if (k === 'class')          out.className      = o[k];
    else out[k] = o[k];
  }
  Object.assign(out, extra);
  return out;
}

function renderNode([tag, attrs, kids], key) {
  const children = Array.isArray(kids) ? kids.map((c, i) => renderNode(c, i)) : null;
  return React.createElement(tag, { ...toAttrs(attrs), key }, children);
}

function Icon({ name, className = 'w-4 h-4', strokeWidth = 1.75, color, ...rest }) {
  const data = ICONS[name] || LUCIDE[name];
  if (!data) {
    return (
      <span
        className={className}
        style={{ display: 'inline-block', background: 'currentColor', opacity: 0.35, borderRadius: 2 }}
      />
    );
  }
  const [, rootAttrs, kids] = data;
  const attrs = toAttrs(rootAttrs, {
    className,
    strokeWidth,
    ...(color ? { stroke: color } : {}),
    'aria-hidden': true,
    ...rest,
  });
  delete attrs.width;
  delete attrs.height;
  return React.createElement('svg', attrs, kids.map((c, i) => renderNode(c, i)));
}

window.Icon = Icon;


// Shared low-level UI primitives: Panel, Pill, Btn, Kbd, Sparkline, Toggle

        </header>
      )}
      <div className={dense ? '' : 'p-4'}>{children}</div>
    </section>

}

function Pill({ tone = 'slate', children, dot = false, className = '' }) {
  const tones = {
    slate:   'bg-ink-800 text-slate2-300 border-ink-700',
    emerald: 'bg-emerald2-600/15 text-emerald2-400 border-emerald2-600/40',

    azure:   'bg-azure2-500/15   text-azure2-400   border-azure2-500/40',

  const dotTones = {

      {dot && <span className={`w-1.5 h-1.5 rounded-full pulse-dot ${dotTones[tone]}`} />}
      {children}
    </span>

}

function Btn({ children, variant = 'ghost', size = 'sm', className = '', icon, iconRight, ...rest }) {
  const variants = {
    ghost:   'border border-ink-700 hover:bg-ink-800 text-slate-200',
    solid:   'bg-slate-100 hover:bg-white text-ink-900 border border-slate-100',
    emerald: 'bg-emerald2-600 hover:bg-emerald2-500 text-ink-950 border border-emerald2-500 shadow-glow-emerald',
    crimson: 'bg-crimson2-600 hover:bg-crimson2-500 text-white border border-crimson2-500 shadow-glow-crimson',
    amber:   'bg-amber2-500   hover:bg-amber2-400   text-ink-950 border border-amber2-400',
    outline: 'border border-ink-600 hover:border-ink-500 text-slate-200',
    danger:  'border border-crimson2-600/50 hover:bg-crimson2-600/15 text-crimson2-400',
  };
  const sizes = {
    xs: 'h-6 px-2   text-[11px]   gap-1',
    sm: 'h-7 px-2.5 text-[11.5px] gap-1.5',
    md: 'h-8 px-3   text-xs       gap-1.5',
    lg: 'h-10 px-4  text-sm       gap-2',

  return (
    <button
      className={`inline-flex items-center justify-center rounded-sm font-medium tracking-tight transition-colors ${variants[variant]} ${sizes[size]} ${className}`}
      {...rest}
    >
      {icon && <Icon name={icon} className="w-3.5 h-3.5" />}
      {children}
      {iconRight && <Icon name={iconRight} className="w-3.5 h-3.5" />}
    </button>
  );
}

function Kbd({ children }) {
  return (
    <kbd className="inline-flex items-center justify-center min-w-[1.4em] px-1.5 h-5 rounded-[3px] border border-ink-700 bg-ink-800 font-mono text-[10px] text-slate2-300">
      {children}
    </kbd>
  );
}

// Single-colour sparkline. Pass an array of numbers.
function Sparkline({ data, color = '#5EA8FF', width = 120, height = 32, fill = true }) {
  const min = Math.min(...data), max = Math.max(...data);
  const range = (max - min) || 1;
  const stepX = width / (data.length - 1);
  const points = data.map((v, i) => [
    i * stepX,
    height - ((v - min) / range) * (height - 4) - 2,
  ]);
  const d    = points.map(([x, y], i) => (i === 0 ? `M${x},${y}` : `L${x},${y}`)).join(' ');
  const area = `${d} L${width},${height} L0,${height} Z`;
  const id   = 'sg-' + color.replace('#', '');
  return (
    <svg width={width} height={height} viewBox={`0 0 ${width} ${height}`} className="overflow-visible">
      <defs>
        <linearGradient id={id} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stopColor={color} stopOpacity="0.35" />
          <stop offset="100%" stopColor={color} stopOpacity="0" />
        </linearGradient>
      </defs>
      {fill && <path d={area} fill={`url(#${id})`} />}
      <path d={d} fill="none" stroke={color} strokeWidth="1.5"
            strokeLinejoin="round" strokeLinecap="round" />
    </svg>
  );
}

// Toggle switch
function Toggle({ on, onChange, disabled = false, label }) {
  return (
    <button
      type="button"
      onClick={() => !disabled && onChange(!on)}
      className={`switch-track relative inline-flex items-center h-5 w-9 rounded-full border
        ${on ? 'bg-emerald2-600/80 border-emerald2-500' : 'bg-ink-800 border-ink-600'}
        ${disabled ? 'opacity-50 cursor-not-allowed' : 'cursor-pointer'}`}
      aria-label={label}
      aria-pressed={on}
    >
      <span className={`switch-thumb absolute top-0.5 left-0.5 w-3.5 h-3.5 rounded-full bg-slate-100 shadow-md ${on ? 'translate-x-4' : ''}`} />
    </button>
  );
}

                      <span className={`font-mono text-[11px] tabular-nums ${
                        tone === 'emerald' ? 'text-emerald2-400' : tone === 'amber' ? 'text-amber2-400' : 'text-crimson2-400'
                      }`}>
                        {m.comp}%
                      </span>
                    </div>
                    <div className="text-right font-mono text-[11px] text-slate-200 tabular-nums">{m.loc.toLocaleString()}</div>
                    <div className="text-right font-mono text-[11px]">
                      <span className={m.ttl === 'overdue' ? 'text-crimson2-400' : 'text-slate-200'}>{m.ttl}</span>
                    </div>
                  </li>
                );
              })}
            </ul>
          </div>

          {/* Sprint Estimation Rule Calculator */}
          <div className="mt-3 rounded-md border border-ink-700/70 bg-ink-900/40 p-3">
            <div className="flex items-center justify-between mb-2">
              <div>
                <div className="text-[12px] font-semibold text-slate-100">Sprint Estimation Rule</div>
                <div className="font-mono text-[10px] text-slate2-500">Enforced ≥ 30% audit buffer — hard-cap at PR merge time</div>
              </div>
              <Pill tone={audit >= 40 ? 'emerald' : audit >= 30 ? 'amber' : 'crimson'} dot>
                BUFFER {audit}%
              </Pill>
            </div>

            <div className="flex items-center gap-3 mb-3">
              <input
                type="range" min="0" max="80" step="5"
                value={audit}
                onChange={(e) => setAudit(+e.target.value)}
                className="slider cd-slider"
              />
              <span className="font-mono text-[11px] text-amber2-400 w-10 text-right tabular-nums">{audit}%</span>
            </div>

            {/* Allocation bar */}
            <div className="h-7 w-full rounded-sm overflow-hidden flex border border-ink-700/60">
              <div
                className="bg-azure2-500/35 border-r border-ink-900 flex items-center justify-center font-mono text-[10px] text-azure2-400"
                style={{ width: `${100 - audit}%` }}
              >
                BUILD · {buildHrs}h
              </div>
              <div
                className="bg-amber2-500/25 flex items-center justify-center font-mono text-[10px] text-amber2-400"
                style={{ width: `${audit}%` }}
              >
                AUDIT · {auditHrs}h
              </div>
            </div>

            <div className="mt-2 flex items-center justify-between font-mono text-[10px] text-slate2-500">
              <span>2-week sprint · capacity {sprintHrs}h/eng</span>
              <span>
                {audit < 30
                  ? <span className="text-crimson2-400">⚠ below minimum — sprint will fail policy R-031</span>
                  : <span className="text-emerald2-400">✓ policy R-031 satisfied</span>
                }
              </span>
            </div>
          </div>
        </div>

        {/* Mandatory Comprehension Reviews */}
        <div className="col-span-5">
          <div className="rounded-md border border-ink-700/70 bg-ink-900/50 h-full flex flex-col">
            <div className="px-3 py-2 border-b border-ink-700/60 flex items-center justify-between">
              <span className="font-mono text-[10px] uppercase tracking-[0.18em] text-slate2-500">
                Mandatory comprehension reviews
              </span>
              <Pill tone="amber">SPRINT-87 · CLOSES 18:00</Pill>
            </div>
            <ul className="divide-y divide-ink-700/40 flex-1">
              {REVIEWS.map((r) => {
                const isOverdue = r.state === 'overdue';
                const isDone    = r.state === 'done';
                return (
                  <li key={r.who} className="px-3 py-2.5 flex items-center gap-3">
                    <div className={`w-5 h-5 rounded-sm border flex items-center justify-center shrink-0 ${
                      isDone
                        ? 'border-emerald2-500/60 bg-emerald2-500/15'
                        : isOverdue
                          ? 'border-crimson2-500/60 bg-crimson2-500/10 blink-amber'
                          : 'border-ink-600 bg-ink-850'
                    }`}>
                      {isDone    && <Icon name="Check" className="w-3 h-3 text-emerald2-400" />}
                      {isOverdue && <Icon name="Clock" className="w-3 h-3 text-crimson2-400" />}
                    </div>
                    <div className="flex-1 min-w-0">
                      <div className="text-[12px] text-slate-100">{r.who}</div>
                      <div className="font-mono text-[10.5px] text-slate2-400 truncate">verbal · {r.mod}</div>
                    </div>
                    <div className="text-right">
                      <div className={`font-mono text-[11px] ${
                        isOverdue ? 'text-crimson2-400' : isDone ? 'text-emerald2-400' : 'text-slate-200'
                      }`}>
                        {r.due}
                      </div>
                      <div className="font-mono text-[10px] text-slate2-500 uppercase">{r.state}</div>
                    </div>
                  </li>
                );
              })}
            </ul>
            <div className="px-3 py-2 border-t border-ink-700/60 flex items-center justify-between font-mono text-[10px] text-slate2-500">
              <span>3 / 5 complete</span>
              <Btn size="xs" icon="CalendarClock">Schedule walk-throughs</Btn>
            </div>
          </div>
        </div>
      </div>
    </Panel>
  );
}

window.ComprehensionDebt = ComprehensionDebt;


// Section 4 — Economic TCO Calculator
// Side-by-side: Human Capital loaded cost vs. Agent Compute burn rate with live ticker.

function TCOCalculator({ live }) {
  // Human side — interactive inputs
  const [salary,  setSalary]  = React.useState(165000);
  const [loading, setLoading] = React.useState(1.32);  // benefits + overhead multiplier
  const [recruit, setRecruit] = React.useState(28000);
  const [rampWk,  setRampWk]  = React.useState(12);

  const humanLoaded = Math.round(salary * loading + recruit + (salary / 52) * rampWk * 0.5);

  // Agent side — animated burn rate
  const agentDaily  = Math.round(1000 + Math.sin(live / 4) * 70 + (live % 11) * 6);
  const agentAnnual = Math.round(agentDaily * 365 + 4800 /* licenses */);
  const delta       = agentAnnual - humanLoaded;
  const agentHigher = delta > 0;

  return (
    <Panel
      eyebrow="ECONOMICS · ANNUALIZED"
      title="System TCO · Human Capital vs. Agent Compute"
      className="col-span-4"
      actions={
        <Pill tone={agentHigher ? 'crimson' : 'emerald'} dot>
          {agentHigher ? 'AGENT > HUMAN' : 'AGENT < HUMAN'}
        </Pill>
      }
    >
      <div className="grid grid-cols-2 gap-2">
        {/* Human column */}
        <div className="rounded-md border border-ink-700/70 bg-ink-900/40 p-3">
          <div className="flex items-center gap-2 mb-2">
            <Icon name="Users" className="w-3.5 h-3.5 text-azure2-400" />
            <span className="font-mono text-[10px] uppercase tracking-[0.18em] text-azure2-400">Human capital</span>
          </div>

          <Field label="Base salary"     value={salary}  onChange={setSalary}  prefix="$" max={400000} step={5000} />
          <Field label="Loading factor"  value={loading} onChange={setLoading} suffix="×" step={0.01} min={1} max={2} fixed={2} />
          <Field label="Recruitment"     value={recruit} onChange={setRecruit} prefix="$" max={150000} step={1000} />
          <Field label="Ramp-up (weeks)" value={rampWk}  onChange={setRampWk} suffix="w" max={52} step={1} />

          <div className="mt-2 pt-2 border-t border-ink-700/60">
            <div className="font-mono text-[10px] text-slate2-500 uppercase tracking-[0.18em]">Annual loaded</div>
            <div className="font-mono text-[22px] text-slate-100 leading-none mt-1 tabular-nums">
              ${humanLoaded.toLocaleString()}
            </div>
            <div className="font-mono text-[10px] text-slate2-500 mt-1">deterministic · 1 FTE</div>
          </div>
        </div>

        {/* Agent column */}
        <div className={`relative rounded-md border bg-ink-900/40 p-3 overflow-hidden ${
          agentHigher ? 'border-crimson2-500/40' : 'border-ink-700/70'
        }`}>
          {/* Live progress strip */}
          <div className="absolute top-0 left-0 right-0 h-0.5 bg-amber2-500/40">
            <div className="h-full bg-amber2-400" style={{ width: `${(live % 60) / 60 * 100}%` }} />
          </div>

          <div className="flex items-center gap-2 mb-2">
            <Icon name="Bot" className="w-3.5 h-3.5 text-amber2-400" />
            <span className="font-mono text-[10px] uppercase tracking-[0.18em] text-amber2-400">Agent compute</span>
          </div>

          <Row label="License (annual)" value="$4,800" />
          <Row label="Context window"   value="142,000 tok" />
          <Row label="Tokens / loop"    value="~ 28k in · 6k out" />
          <Row label="Active loops"     value={`${24 + (live % 7)} concurrent`} />

          <div className="mt-2 pt-2 border-t border-ink-700/60">
            <div className="font-mono text-[10px] text-amber2-400 uppercase tracking-[0.18em] flex items-center gap-1.5">
              <span className="w-1.5 h-1.5 rounded-full bg-amber2-400 pulse-dot" />
              Live burn · 24h rolling
            </div>
            <div className="font-mono text-[22px] text-amber2-400 leading-none mt-1 tabular-nums">
              ${agentDaily.toLocaleString()}<span className="text-[12px] text-slate2-400"> /day</span>
            </div>

            <div className="mt-2 font-mono text-[10px] text-slate2-500 uppercase tracking-[0.18em]">Annualized</div>
            <div className={`font-mono text-[18px] leading-none mt-1 tabular-nums ${
              agentHigher ? 'text-crimson2-400' : 'text-emerald2-400'
            }`}>
              ${agentAnnual.toLocaleString()}
            </div>
            <div className="font-mono text-[10px] text-slate2-500 mt-1">unsupervised loop assumption</div>
          </div>
        </div>
      </div>

      {/* Delta strip */}
      <div className={`mt-3 rounded-md border px-3 py-2 flex items-center gap-3 ${
        agentHigher
          ? 'border-crimson2-500/40 bg-crimson2-500/[0.06]'
          : 'border-emerald2-500/40 bg-emerald2-500/[0.05]'
      }`}>
        <Icon
          name={agentHigher ? 'TrendingUp' : 'TrendingDown'}
          className={`w-4 h-4 ${agentHigher ? 'text-crimson2-400' : 'text-emerald2-400'}`}
        />
        <div className="flex-1 min-w-0">
          <div className="text-[12px] text-slate-100">
            {agentHigher
              ? 'Agent loops cost more than the equivalent FTE'
              : 'Agent envelope still under FTE cost'}
          </div>
          <div className="font-mono text-[10px] text-slate2-500">
            Δ {agentHigher ? '+' : '−'}${Math.abs(delta).toLocaleString()}/yr · break-even at ~${Math.round(humanLoaded / 365).toLocaleString()}/day
          </div>
        </div>
        <Btn size="xs" icon="Wand2">Optimize loop</Btn>
      </div>

      {/* Live ticker tape */}
      <div className="mt-2 overflow-hidden rounded-sm border border-ink-700/60 bg-ink-950/80">
        <div className="marquee-track whitespace-nowrap font-mono text-[10.5px] text-slate2-400 py-1.5">
          {Array.from({ length: 2 }).map((_, k) => (
            <span key={k}>
              <T label="tok-in"   v={`${(2810 + (live % 99)).toLocaleString()}/s`} />
              <T label="tok-out"  v={`${(640  + (live % 31)).toLocaleString()}/s`} />
              <T label="$/min"    v={`$${(0.71 + (live % 13) / 100).toFixed(2)}`} tone="amber" />
              <T label="ctx-fill" v={`${82 + (live % 18)}%`} />
              <T label="loop-id"  v={`loop_${(48201 + live).toString(16)}`} />
              <T label="cache-hit"v={`${44 + (live % 17)}%`} />
              <T label="retries"  v={`${live % 4}`} />
            </span>
          ))}
        </div>
      </div>
    </Panel>
  );
}

function Field({ label, value, onChange, prefix, suffix, step = 1, min = 0, max = 1000000, fixed = 0 }) {
  return (
    <label className="flex items-center justify-between gap-2 py-1">
      <span className="text-[11px] text-slate2-400">{label}</span>
      <div className="inline-flex items-center gap-1 font-mono text-[11px]">
        {prefix && <span className="text-slate2-500">{prefix}</span>}
        <input
          type="number"
          value={fixed ? (+value).toFixed(fixed) : value}
          min={min} max={max} step={step}
          onChange={(e) => onChange(+e.target.value)}
          className="w-20 bg-ink-850 border border-ink-700 rounded-sm px-1.5 py-0.5 text-right text-slate-100 focus:outline-none focus:border-azure2-500"
        />
        {suffix && <span className="text-slate2-500">{suffix}</span>}
      </div>
    </label>
  );
}

function Row({ label, value }) {
  return (
    <div className="flex items-center justify-between py-1 font-mono text-[11px]">
      <span className="text-slate2-400">{label}</span>
      <span className="text-slate-100 tabular-nums">{value}</span>
    </div>
  );
}

function T({ label, v, tone }) {
  return (
    <span className="mx-3 inline-flex items-center gap-1">
      <span className="text-slate2-500 uppercase tracking-[0.12em] text-[9.5px]">{label}</span>
      <span className={tone === 'amber' ? 'text-amber2-400' : 'text-slate-200'}>{v}</span>
      <span className="text-slate2-700">·</span>
    </span>
  );
}

window.TCOCalculator = TCOCalculator;


// HybridEngine — Agent Orchestration & Observability
// Root component: composes sidebar, top bar, and four dashboard sections.

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function App() {
  const [active, setActive] = React.useState('dashboard');
  const [tick,   setTick]   = React.useState(0);

  // PRP metrics — slow-drift simulation
  const [velocity,    setVelocity]    = React.useState(224);
  const [throughput,  setThroughput]  = React.useState(43.4);
  const [stability,   setStability]   = React.useState(16.4);
  const [spend,       setSpend]       = React.useState(1042);

  React.useEffect(() => {
    const id = setInterval(() => {
      setTick((t) => t + 1);
      setVelocity((v)   => clamp(v   + (Math.random() - 0.4) * 0.6,  210, 240));
      setThroughput((v) => clamp(v   + (Math.random() - 0.6) * 0.05, 42,  46));
      setStability((v)  => clamp(v   + (Math.random() - 0.4) * 0.06, 15.6, 17.2));
      setSpend((v)      => clamp(v   + (Math.random() - 0.45) * 4,   980, 1120));
    }, 1500);
    return () => clearInterval(id);
  }, []);

  const time = new Date(Date.UTC(2026, 4, 22, 14, 32, 8) + tick * 1500)
    .toISOString().slice(11, 19) + ' UTC';

  return (
    <div className="h-screen w-screen flex bg-ink-900 bg-grid overflow-auto min-w-[1480px]">
      <Sidebar active={active} onSelect={setActive} />

      <main className="flex-1 min-w-0 flex flex-col">
        <TopBar time={time} active={active} />

        <div className="flex-1 overflow-y-auto px-5 py-4">
          {/* Section 1 — PRP Header KPIs */}
          <PRPHeader
            velocity={velocity}
            throughput={throughput}
            stability={stability}
            spend={spend}
          />

          {/* Section 2 — Agent Harness Intercept Pipeline */}
          <div className="grid grid-cols-12 gap-3 mt-4">
            <HarnessPipeline />
          </div>

          {/* Sections 3 & 4 — Comprehension Debt + TCO Calculator */}
          <div className="grid grid-cols-12 gap-3 mt-4 mb-6">
            <ComprehensionDebt />
            <TCOCalculator live={tick} />
          </div>
        </div>
      </main>
    </div>
  );
}

function TopBar({ time, active }) {
  const crumbs = {
    dashboard:    ['Operations', 'Mission Control'],
    harness:      ['Operations', 'Agent Harness'],
    fleet:        ['Operations', 'Agent Fleet'],
    incidents:    ['Operations', 'Incidents'],
    debt:         ['Insight',    'Debt Analytics'],
    reviews:      ['Insight',    'Comprehension Reviews'],
    lineage:      ['Insight',    'Code Lineage'],
    tco:          ['Insight',    'System TCO'],
    rules:        ['Configuration', 'Agent.md Ruleset'],
    sandboxes:    ['Configuration', 'Sandbox Envelopes'],
    integrations: ['Configuration', 'Integrations'],
    settings:     ['Configuration', 'Settings'],
  }[active] || ['Operations', 'Mission Control'];

  return (
    <header className="h-14 shrink-0 border-b border-ink-700/70 bg-ink-950/60 backdrop-blur flex items-center px-5 gap-4 whitespace-nowrap">
      {/* Breadcrumbs */}
      <div className="flex items-center gap-1.5 font-mono text-[11px] text-slate2-400 shrink-0">
        <span>{crumbs[0]}</span>
        <Icon name="ChevronRight" className="w-3 h-3 text-slate2-600" />
        <span className="text-slate-100">{crumbs[1]}</span>
        <Pill tone="emerald" dot className="ml-2">LIVE</Pill>
      </div>

      {/* Command search */}
      <div className="flex-1 max-w-md">
        <button className="w-full h-8 px-2.5 flex items-center gap-2.5 rounded-sm border border-ink-700 hover:border-ink-600 bg-ink-850/60 text-left">
          <Icon name="Search" className="w-3.5 h-3.5 text-slate2-500 shrink-0" />
          <span className="text-[11.5px] text-slate2-400 flex-1 truncate">
            Run command, route to agent, query log…
          </span>
          <Kbd>⌘</Kbd><Kbd>K</Kbd>
        </button>
      </div>

      {/* Right cluster */}
      <div className="flex items-center gap-2 shrink-0">
        <div className="hidden xl:flex items-center gap-3 pr-3 border-r border-ink-700/70">
          <TopStat label="incidents"   value="1"     tone="crimson" />
          <TopStat label="intercepts/h" value="38"   tone="amber"  />
          <TopStat label="agents"      value="24/40" tone="emerald" />
        </div>
        <Btn size="sm" variant="ghost" icon="Bell">3</Btn>
        <Btn size="sm" variant="ghost" icon="GitPullRequest">PRs</Btn>
        <Btn size="sm" variant="amber" icon="ShieldAlert">1 awaiting HITL</Btn>
        <div className="pl-2 ml-1 border-l border-ink-700/70 font-mono text-[10.5px] text-slate2-400 tabular-nums">
          {time}
        </div>
      </div>
    </header>
  );
}

function TopStat({ label, value, tone }) {
  const tones = {
    crimson: 'text-crimson2-400',
    amber:   'text-amber2-400',
    emerald: 'text-emerald2-400',
  };
  return (
    <div className="flex items-baseline gap-1.5 font-mono text-[10.5px]">
      <span className="uppercase tracking-[0.14em] text-slate2-500">{label}</span>
      <span className={`tabular-nums ${tones[tone]}`}>{value}</span>
    </div>
  );
}

// Boot
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

  </script>
</body>
</html>
